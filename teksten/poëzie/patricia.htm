<h1>Patricia</b></h1>

<p><strong>Ik zie sproeten waar ik kijk<br>
en ook haar stem stemt vrolijk.</strong></p>

<p><strong>Zij heeft vertrouwen<br>
Zij heeft haast: <br>
de wereld wacht op haar.</strong></p>

<p><strong>Boven haar sjaal lachen haar ogen<br>
als ze afscheid neemt.</strong></p>

<p>&nbsp;</p>
