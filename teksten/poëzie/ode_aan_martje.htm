<h1>Ode aan Martje</b></h1>

<p>&nbsp;</p>

<p><strong>Haar ogen zijn zo naakt als gras<br>
en aan haar mond is alles af te lezen<br>
voor wie het gebaar verstaat,<br>
de taal, waarmee zij haar wegstrijkt.</strong></p>

<p><strong>Woorden aarzelen op haar lippen,<br>
komen tenslotte als waarheden<br>
als rustige handen.</strong></p>

<p>&nbsp;</p>
