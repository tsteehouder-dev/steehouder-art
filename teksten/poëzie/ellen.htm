<h1>Ellen</b></h1>

<p><strong>Zij rolt - een gele bal - de piste in<br>
en springt daar open als een feest</strong></p>

<p><strong>ze spant zich, veert en balanceert:<br>
schat onze diepte met een waakzaam oog</strong></p>

<p><strong>vertrouwt en springt</strong></p>

<p><strong>en als zij valt dan zijn er<br>
zoveel netten als er vrienden zijn</strong></p>

<p>&nbsp;</p>
