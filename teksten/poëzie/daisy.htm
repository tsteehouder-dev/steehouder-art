<h1>Daisy</b></h1>

<p><strong>Wordt heldere schoonheid genoeg geroemd<br>
met woorden als madelief<br>
maagdelief en meizoentje?<br>
Bellis perennis, witte ganzebloem?</strong></p>

<p><strong>De boomleeuwerik klinkt zelfs gewestelijk<br>
uit haar keel, en jawel: <br>
dit is wat ik hoor:<br>
zij lacht!</strong></p>

<p><strong>Is dit de naam voor ogen die zo kijken?</strong></p>
