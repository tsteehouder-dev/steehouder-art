<h1>Bewondering</h1>

<p><strong>Ik kijk je aan en ben een kind.</strong></p>

<p><strong>Je leert mij zien hoe alles is<br>
je leert mij vliegen en weer dalen<br>
je leert mij lezen in je ogen <br>
je leert mij schrijven wat hier staat</strong></p>

<p><strong>Je zegt: hou nou mijn hand niet langer vast</strong></p>

<p><strong>Je laat mij staan</strong></p>
