<h1>Angelique</b></h1>

<p><strong>Ik nader de omzoomde perken<br>
van haar huis:<br>
gazon, schoon grind en verse voegen.<br>
Het is geheel terzake en beaamt.</strong></p>

<p><strong>Wat knarst. Ik stop.<br>
Er schuift een teken voor de zon.</strong></p>

<p><strong>Woorden dwarrelen dood als snippers.<br>
De smaak van as verstomt.</strong></p>

<p><strong>Wat biedt troost?<br>
Hoe kan verzachten?</strong></p>
