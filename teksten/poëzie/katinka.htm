<h1>Katinka</b></h1>

<p><strong>De raakbaarheid van water<br>
bezit haar. Bij vlagen<br>
scheren vogels door haar heen.</strong></p>

<p><strong>Schaduw.</strong></p>

<p><strong>Zij beeft: rimpeling <br>
van binnenuit waar iets <br>
gebeurt.</strong></p>
