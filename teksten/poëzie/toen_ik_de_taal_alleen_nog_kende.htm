<h2>Toen ik de taal alleen nog kende</b></h2>

<p><strong>Toen ik de taal alleen nog kende<br>
van horen zeggen<br>
las ik al in iemands ogen <br>
dronk ik al van iemands lippen</strong></p>

<p><strong>ook later <br>
heb ik nooit meer geweten<br>
van toen<br>
dan toen</strong></p>
