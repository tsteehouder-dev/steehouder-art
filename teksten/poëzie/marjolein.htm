<h1>Marjolein</b></h1>

<p><strong>Hier past een ode aan de aster,</strong></p>

<p><strong>gewone bloem<br>
die een hand geeft en zegt<br>
'Ik heb maar wat gedaan.'</strong></p>

<p><strong>Sterke bloem<br>
die nog staat als je sterft.</strong></p>

<p><strong>Bloem die bloost en lacht<br>
bij een gedicht als dit.</strong></p>

<p>&nbsp;</p>
