<h1>Lieke</b></h1>

<p><strong>Er valt zo nu en dan een gat<br>
in haar verdediging</strong></p>

<p><strong>Dan lacht zij zonder waakzaamheid</strong></p>

<p><strong>Als ooit haar schaal mocht breken<br>
dan vloeit zij uit als louter warmte</strong></p>
