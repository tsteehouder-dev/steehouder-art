<h1>Ieders eigen kleine drama</b></h1>

<dl>
  <dt>&nbsp;</dt>
  <dt><strong>Daar sta je dan </strong></dt>
  <dt><strong>en weet niet meer</strong></dt>
  <dt><strong>of dit een treurspel is.</strong></dt>
  <dd>&nbsp;</dd>
  <dt><strong>Je staat </strong></dt>
  <dt><strong>en lacht en huilt</strong></dt>
  <dd>&nbsp;</dd>
  <dt><strong>beurtelings en tegelijkertijd.</strong></dt>
  <dt><strong>Met bloemen aan het slot.</strong></dt>
  <dd>&nbsp;</dd>
  <dt><strong>Met bebloede handen hou je de rozen</strong></dt>
  <dt><strong>vast omklemd.</strong></dt>
</dl>
