<h1>Proloog</b></h1>

<dl>
  <dt><strong>Vanuit de buik ontstond een droom.</strong></dt>
  <dt><strong>Warmte stroomde. </strong></dt>
  <dt>&nbsp;</dt>
  <dt><strong>er was veel licht</strong></dt>
  <dt>&nbsp;</dt>
  <dt><strong>ik ben ontwaakt en zie:</strong></dt>
  <dt><strong>dit is mijn hoofd</strong></dt>
  <dt><strong>het doet weer mee</strong></dt>
  <dt>&nbsp;</dt>
  <dt><strong>het speelt een ingetogen spel</strong></dt>
  <dt><strong>van bitter en van zuur</strong></dt>
  <dt>&nbsp;</dt>
  <dt><strong>zodat alles samentrekt</strong></dt>
  <dt><strong>en er een steen rolt in mijn maag</strong></dt>
</dl>
