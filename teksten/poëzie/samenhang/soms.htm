<h1>Soms</b></h1>

<dl>
  <dt>&nbsp;</dt>
  <dt><strong>Soms kan het geluk</strong></dt>
  <dt><strong>je achtervolgen als een zacht hijgen.</strong></dt>
  <dt><strong>De grond onder je voeten</strong></dt>
  <dt><strong>verzacht tot een moeras, te zacht</strong></dt>
  <dt><strong>om nog tot vluchten om te slaan.</strong></dt>
  <dt><strong>Je zinkt en hoort je eigen stem</strong></dt>
  <dt><strong>een pauw in de nacht.</strong></dt>
</dl>
