<h1>Het onverwachte</b></h1>

<dl>
  <dt><strong>In de slaap begint de vernietiging</strong></dt>
  <dt><strong>ruggelings tegen de aarde</strong></dt>
  <dt><strong>ben ik zonder verweer te geef</strong></dt>
  <dt><strong>en word zo vredig wakker</strong></dt>
  <dt><strong>dat ik geluk ontdek</strong></dt>
</dl>
